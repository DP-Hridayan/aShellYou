name: Build Debug APK

on:
  workflow_dispatch:
  pull_request:
  workflow_run:
    workflows: ["Crowdin Download"]
    types: [completed]

jobs:
  check-crowdin-pr:
    name: Check for Crowdin PR
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      pr_exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Check for open PR from localization branch
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh pr list --repo "$GITHUB_REPOSITORY" --head localization --state open --json number --jq 'length')
          if [ "$COUNT" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Debug APK
    needs: [check-crowdin-pr]
    if: |
      always() &&
      (github.event_name != 'workflow_run' || needs.check-crowdin-pr.outputs.pr_exists == 'true')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'localization' || '' }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission to Gradle
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleGithubDebug

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/github/debug/*.apk
