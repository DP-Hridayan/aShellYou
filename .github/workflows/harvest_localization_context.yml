name: Generate Native AI Context
on:
  workflow_dispatch:

jobs:
  enrich-context:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install CLI and Official Gemini SDK
        run: |
          npm init -y
          npm i -g @crowdin/cli
          npm install @google/genai

      - name: Download Empty Context Strings
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
        # This native command creates a crowdin-context.jsonl file with missing strings
        run: crowdin context download --status empty --token=$CROWDIN_PERSONAL_TOKEN --project-id=$CROWDIN_PROJECT_ID

      - name: Process with Gemini (Rate-Limit Protected)
        env:
          GOOGLE_AI_KEY: ${{ secrets.GOOGLE_AI_KEY }}
        run: |
          cat << 'EOF' > enrich.mjs
          import fs from 'fs';
          import { execSync } from 'child_process';
          import { GoogleGenAI } from '@google/genai';

          const ai = new GoogleGenAI({ apiKey: process.env.GOOGLE_AI_KEY });
          
          async function run() {
            const file = 'crowdin-context.jsonl';
            if (!fs.existsSync(file)) return console.log('No empty strings found.');
            
            const lines = fs.readFileSync(file, 'utf-8').split('\n').filter(Boolean);
            const output = [];

            for (const line of lines) {
              const data = JSON.parse(line);
              const key = data.identifier;
              
              let snippet = "";
              try {
                // Search all Kotlin and XML files for the string key, grabbing 3 lines of surrounding code
                snippet = execSync(`grep -rnw -A 3 -B 3 '.' -e "${key}" --include=\\*.{kt,xml} || true`).toString();
              } catch (e) {}

              if (snippet.trim()) {
                const prompt = `Analyze this Android codebase snippet for the string key '${key}'. \n\nCode:\n${snippet}\n\nWrite a concise 1-3 sentence description explaining the exact UI placement and element type. Do not use quotes or markdown.`;
                
                try {
                  const response = await ai.models.generateContent({
                    model: 'gemini-3.5-flash-lite',
                    contents: prompt,
                  });
                  data.context = response.text.trim();
                  console.log(`✅ Generated context for: ${key}`);
                } catch (err) {
                  console.log(`❌ Failed for ${key}: ${err.message}`);
                }

                // SLEEP FOR 4.5 SECONDS: Guarantees we stay under the 15 RPM limit (No 429 Errors)
                await new Promise(r => setTimeout(r, 4500));
              } else {
                console.log(`⏭️ Skipped ${key} - Not found in source code.`);
              }
              output.push(JSON.stringify(data));
            }
            
            fs.writeFileSync(file, output.join('\n'));
          }
          run();
          EOF
          node enrich.mjs

      - name: Upload Enriched Context
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
        # Pushes the generated context descriptions back to Crowdin
        run: crowdin context upload --token=$CROWDIN_PERSONAL_TOKEN --project-id=$CROWDIN_PROJECT_ID
