name: Harvest Localization Context

on:
  workflow_dispatch:

jobs:
  harvest-context:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Run Crowdin Context Harvester
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          GOOGLE_AI_KEY: ${{ secrets.GOOGLE_AI_KEY }}
          GOOGLE_AI_BASE_URL: "https://generativelanguage.googleapis.com/v1beta/openai/"
        run: |
          npx crowdin-context-harvester harvest \
            --token="$CROWDIN_PERSONAL_TOKEN" \
            --project="$CROWDIN_PROJECT_ID" \
            --ai="openai" \
            --openAiKey="$GOOGLE_AI_KEY" \
            --openAiBaseUrl="$GOOGLE_AI_BASE_URL" \
            --model="gemini-3.5-flash" \
            --output="crowdin" \
            --concurrency=5
            
