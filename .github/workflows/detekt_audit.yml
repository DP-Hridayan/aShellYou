name: Detekt Full Codebase Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  audit:
    name: Full Codebase Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Detekt Analysis
        run: ./gradlew detekt
        continue-on-error: true 

      - name: Upload Full Detekt Report
        uses: actions/upload-artifact@v7
        with:
          name: full-codebase-detekt-report
          path: app/build/reports/detekt/detekt.html 
          
