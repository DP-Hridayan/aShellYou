name: Build and Publish Github Release

on:
  push:
    tags:
      - "v*" # Runs when a tag like "v6.0.1" is pushed

jobs:
  build:
    name: Build and Sign APK
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks

      - name: Set Environment Variables
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "KEYSTORE_PATH=$PWD/keystore.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew

      - name: Build APK and Update Lint Baseline
        run: ./gradlew assembleGithubRelease assembleFdroidRelease --stacktrace

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Signed-APKs
          path: |
            app/build/outputs/apk/github/release/*.apk
            app/build/outputs/apk/fdroid/release/*.apk

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Signed APK
        uses: actions/download-artifact@v8
        with:
          name: Signed-APKs
          path: artifacts/

      - name: Install xmllint
        run: sudo apt-get install -y libxml2-utils

      - name: Extract Changelog from strings.xml
        run: |
          VERSION_TAG="${{ github.ref_name }}"       # Example: v6.0.1
          VERSION_TAG_XML=$(echo $VERSION_TAG | tr '.' '_' | tr -d 'v')  # Convert v6.0.1 → 6_0_1
          CHANGELOG=$(xmllint --xpath "string(//string[@name='changelog_v${VERSION_TAG_XML}']/text())" app/src/main/res/values/strings.xml || echo "No changelog found for $VERSION_TAG")

          if [[ -z "$CHANGELOG" ]]; then
            echo "#### Refer to full changelogs $VERSION_TAG"
            exit 1
          fi

          # Convert \n to newline + bullet
          CHANGELOG=$(echo "$CHANGELOG" | sed 's/\\n/\n* /g')
          
          # Add heading cleanly
          CHANGELOG="### Changelog\n\n$CHANGELOG"
          
          # Write to file
          echo -e "$CHANGELOG" > changelog.txt


      - name: Publish Release using gh CLI
        run: |
          APK_FILES=$(find artifacts -name "*.apk")

          if [ -z "$APK_FILES" ]; then
            echo "❌ No APKs found!"
            exit 1
          fi

          echo "✅ Found APKs:"
          echo "$APK_FILES"

          gh release create "$GITHUB_REF_NAME" \
            $APK_FILES \
            --title "aShell You $GITHUB_REF_NAME" \
            --notes-file changelog.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Telegram of New Release
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          THREAD_ID: ${{ secrets.RELEASE_THREAD_ID }}
        run: |
          TAG=$GITHUB_REF_NAME
          URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/${TAG}"
          COFFEE_URL="https://buymeacoffee.com/hridayan"

          # Find the previous *stable* tag (vX.Y.Z only — skips alpha/beta/rc builds)
          STABLE_TAGS=$(git tag --list --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')
          PREV_TAG=$(echo "$STABLE_TAGS" | awk -v cur="$TAG" '$0==cur{found=1; next} found{print; exit}')
          if [ -n "$PREV_TAG" ]; then
            COMPARE_URL="https://github.com/$GITHUB_REPOSITORY/compare/${PREV_TAG}...${TAG}"
          else
            COMPARE_URL="https://github.com/$GITHUB_REPOSITORY/commits/${TAG}"
          fi

          # Escape MarkdownV2 reserved characters: _ * [ ] ( ) ~ ` > # + - = | { } . !
          escape_md() {
            echo "$1" | sed -e 's/\\/\\\\/g' \
                             -e 's/_/\\_/g' \
                             -e 's/\*/\\*/g' \
                             -e 's/\[/\\[/g' \
                             -e 's/\]/\\]/g' \
                             -e 's/(/\\(/g' \
                             -e 's/)/\\)/g' \
                             -e 's/~/\\~/g' \
                             -e 's/`/\\`/g' \
                             -e 's/>/\\>/g' \
                             -e 's/#/\\#/g' \
                             -e 's/+/\\+/g' \
                             -e 's/-/\\-/g' \
                             -e 's/=/\\=/g' \
                             -e 's/|/\\|/g' \
                             -e 's/{/\\{/g' \
                             -e 's/}/\\}/g' \
                             -e 's/\./\\./g' \
                             -e 's/!/\\!/g'
          }

          ESC_TAG=$(escape_md "$TAG")

          # Reuse the changelog already extracted earlier in the job,
          # skipping the "### Changelog" heading and its blank line
          CHANGELOG_BODY=$(tail -n +3 changelog.txt)
          ESC_CHANGELOG=$(escape_md "$CHANGELOG_BODY")
          QUOTED_CHANGELOG=$(echo "$ESC_CHANGELOG" | sed 's/^/>/')

          TEXT=$(cat <<EOF
          🚀 *aShellYou${ESC_TAG} is released*

          ${QUOTED_CHANGELOG}
          >
          >See full changelogs [here](${COMPARE_URL})
          EOF
          )

          REPLY='{"inline_keyboard":[[{"text":"View Release","url":"'"$URL"'"},{"text":"Buy Me a Coffee☕","url":"'"$COFFEE_URL"'"}]]}'

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d parse_mode="MarkdownV2" \
            -d text="$TEXT" \
            -d reply_markup="$REPLY" \
            -d message_thread_id="$THREAD_ID"
